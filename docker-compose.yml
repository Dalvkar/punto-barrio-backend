services:
  postgres:
    image: postgres:16-alpine
    container_name: tiendita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiendita
      POSTGRES_PASSWORD: tiendita
      POSTGRES_DB: tiendita
    ports:
      - "5432:5432"
    volumes:
      - tiendita_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiendita -d tiendita"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tiendita_data:
